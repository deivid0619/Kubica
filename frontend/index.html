<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171C">
<script>
/* la marca (colores y logo, ver src/core/marca.js) antes de pintar nada.
   __MARCA__ lo pone Vite al construir (VITE_MARCA); ?marca=nombre la cambia
   solo en este navegador y la recuerda (?marca=kubica vuelve a la propia). */
(function () {
  var m = '__MARCA__'
  try {
    var q = new URLSearchParams(location.search).get('marca')
    if (q) localStorage.setItem('marca', q)
    m = localStorage.getItem('marca') || m
  } catch (e) {}
  if (!/^[a-z0-9-]+$/.test(m)) m = 'kubica'
  document.documentElement.setAttribute('data-marca', m)
  if (m === 'pigmalion') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0B0B')
  /* el modo oscuro de esta persona en este dispositivo (src/core/tema.js):
     'oscuro', 'claro' o automatico (sigue al celular) */
  try {
    var t = localStorage.getItem('tema')
    var dark = t === 'oscuro' || (t !== 'claro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    if (dark) {
      document.documentElement.setAttribute('data-tema', 'oscuro')
      var meta = document.querySelector('meta[name="theme-color"]')
      meta.setAttribute('data-claro', meta.getAttribute('content'))
      meta.setAttribute('content', '#0B0C0E')
    }
  } catch (e) {}
})()
</script>
<meta name="color-scheme" content="light">
<meta name="description" content="Inventario de la bodega: modelo 3D, escaneo, reserva y reportes.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__NOMBRE__">
<title>__NOMBRE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo + IBM Plex Mono: Kubica. DM Sans + DM Mono: el tema de Pigmalion -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,500..900&display=swap" rel="stylesheet">
<style>
/* la pantalla de carga: se ve apenas se abre la app, antes de que llegue el
   codigo (y mientras se conecta con el servidor). La app la reemplaza al
   cargar; la misma la usa ui/Boot.jsx. Todavia no hay global.css: los colores
   de cada marca van aqui. */
:root{--boot-ink:#15171C;--boot-accent:#F5B700;--boot-msg:#BDB8AE}
:root[data-marca="pigmalion"]{--boot-ink:#0B0B0B;--boot-accent:#C0FF00;--boot-msg:#B9BDB6}
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--boot-ink);color:#fff;font-family:'Archivo',system-ui,-apple-system,sans-serif;text-align:center}
[data-marca="pigmalion"] .boot{font-family:'DM Sans',system-ui,-apple-system,sans-serif}
.boot-brand{display:flex;align-items:center;gap:12px;animation:boot-in 420ms cubic-bezier(.23,1,.32,1) both}
.boot-word{font:800 38px/1 'Archivo',system-ui,sans-serif;font-stretch:115%;letter-spacing:.01em;text-transform:uppercase;padding-right:3px}
[data-marca="pigmalion"] .boot-word{font:italic 800 40px/1 'DM Sans',system-ui,sans-serif;letter-spacing:-.055em;text-transform:lowercase}
.boot-mark-pigmalion{display:none}
[data-marca="pigmalion"] .boot-mark-kubica{display:none}
[data-marca="pigmalion"] .boot-mark-pigmalion{display:block}
.boot-bar{position:relative;width:132px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;animation:boot-in 420ms 120ms cubic-bezier(.23,1,.32,1) both}
.boot-bar i{position:absolute;inset:0;width:40%;border-radius:4px;background:var(--boot-accent);animation:boot-slide 1.1s cubic-bezier(.77,0,.175,1) infinite}
.boot-msg{max-width:280px;margin:0;min-height:2.6em;font-size:14px;line-height:1.35;color:var(--boot-msg);animation:boot-in 420ms 220ms cubic-bezier(.23,1,.32,1) both}
.boot.page{position:absolute;background:transparent;color:var(--ink)}
.boot.page .boot-bar{background:rgba(var(--ink-rgb),.1)}
.boot.page .boot-msg{color:var(--muted)}
@keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.boot-brand,.boot-bar,.boot-msg{animation:none}.boot-bar i{animation:boot-pulse 1.6s ease-in-out infinite;width:100%;transform:none}}
@keyframes boot-pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div id="root"><div class="boot" role="status" aria-live="polite"><div class="boot-brand"><svg class="boot-mark-kubica" viewBox="0 0 28 28" width="40" height="40" aria-hidden="true"><g stroke="#15171C" stroke-width="1.1" stroke-linejoin="round"><path d="M14 3l10.5 6L14 15 3.5 9z" fill="#F5B700"/><path d="M3.5 9L14 15v11.5L3.5 20.5z" fill="#fff" fill-opacity=".92"/><path d="M24.5 9L14 15v11.5l10.5-6z" fill="#fff" fill-opacity=".42"/></g></svg><svg class="boot-mark-pigmalion" viewBox="0 0 28 28" width="40" height="40" aria-hidden="true"><path d="M10.2 4.5h14.3l-2.6 4.6H7.6z" fill="#C0FF00"/><path d="M7.6 11.7h14.3l-2.6 4.6H5z" fill="#C0FF00"/><path d="M5 18.9h14.3l-2.6 4.6H2.4z" fill="#C0FF00"/></svg><span class="boot-word">__NOMBRE__</span></div><div class="boot-bar"><i></i></div><p class="boot-msg">Abriendo…</p></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
